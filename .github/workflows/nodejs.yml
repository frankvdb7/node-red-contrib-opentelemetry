name: Lint, Build, Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: install
        run: npm ci
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build --if-present
      - name: test
        run: npm run test:cov
        env:
          CI: true
          NODE_OPTIONS: --enable-source-maps
          NODE_V8_COVERAGE: ${{ runner.temp }}/fallow-coverage
      - name: fallow audit
        run: npm run fallow -- --coverage "${{ runner.temp }}/fallow-coverage"
      - name: pack-check
        run: npm run pack:check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-red-version: [4, 5]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          CI: true
          NODE_RED_VERSION: ${{ matrix.node-red-version }}
      - name: Upload runtime and collector logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-node-red-${{ matrix.node-red-version }}
          path: .integration-logs/
          include-hidden-files: true
          if-no-files-found: warn
